[package]
name = "rustlogx"
version = "0.1.0"
edition = "2024"
description = "Universal structured logging library for Rust"

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["serde", "v7"] }

[[example]]
name = "demo"
path = "examples/demo.rs"